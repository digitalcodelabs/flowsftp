<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#313244" stop-opacity="0.8" />
    </linearGradient>

    <!-- Prompt Chevron Gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- Cursor Gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>

    <!-- Drop Shadow for Terminal Window -->
    <filter id="windowShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Main Squircle Body -->
  <rect
    x="64"
    y="64"
    width="896"
    height="896"
    rx="200"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="12"
    filter="url(#windowShadow)"
  />

  <!-- Top Window Header Bar -->
  <line x1="64" y1="230" x2="960" y2="230" stroke="#313244" stroke-width="8" />

  <!-- Window Dots (Red, Yellow, Green) -->
  <circle cx="170" cy="148" r="26" fill="#f38ba8" />
  <circle cx="245" cy="148" r="26" fill="#f9e2af" />
  <circle cx="320" cy="148" r="26" fill="#a6e3a1" />

  <!-- Terminal Title subtle glow pill -->
  <rect x="432" y="132" width="160" height="32" rx="16" fill="#313244" opacity="0.6" />

  <!-- Terminal Prompt Chevron (>) -->
  <path
    d="M 240 400 L 440 540 L 240 680"
    fill="none"
    stroke="url(#chevronGrad)"
    stroke-width="64"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal Cursor Block (_) -->
  <line
    x1="520"
    y1="680"
    x2="780"
    y2="680"
    stroke="url(#cursorGrad)"
    stroke-width="64"
    stroke-linecap="round"
  />
</svg>
